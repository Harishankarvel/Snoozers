[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-av-backend"
version = "2.4.0"
description = "AURA-AV Decision Engine, Guidance Module and WebSocket Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103.1",
    "uvicorn>=0.23.2",
    "websockets>=11.0.3",
    "ultralytics>=8.0.0",
    "numpy>=1.24.3",
    "opencv-python>=4.8.0.76",
    "pydantic>=2.4.2",
    "filterpy>=1.4.5",
    "scipy>=1.11.2",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
