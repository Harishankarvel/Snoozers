<body class="bg-[#05070B] text-slate-100 font-sans antialiased select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Audio Sound Synthesis ---
    class AudioManager {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.lastAlert = 0;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playBeep(freq = 880, dur = 0.08, type = 'sine') {
        if (this.isMuted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      }
      playCriticalAlert() {
        const now = Date.now();
        if (this.isMuted || now - this.lastAlert < 1500) return;
        this.lastAlert = now;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(950, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.15);
          osc.frequency.linearRampToValueAtTime(950, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.35);
        } catch(e) {}
      }
    }
    const audioManager = new AudioManager();

    // --- Synthetic Procedural Engine ---
    class MockEngine {
      constructor() {
        this.isRunning = false;
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1280;
        this.canvas.height = 720;
        this.ctx = this.canvas.getContext('2d');
        this.frameCallback = null;
        this.telemetryCallback = null;
        this.frameCount = 0;
        this.egoSpeed = 68.4;
        this.targetSpeed = 70.0;
        this.steering = 0;
        this.brakePressure = 0;
        this.throttle = 45;
        this.roadOffset = 0;
        this.activeFaults = new Map();
        this.objects = [
          { id: 101, class: 'car', lane: 0, distanceZ: 38.0, lateralOffset: 0.0, speedKmh: 65.0, color: '#00F0FF' },
          { id: 102, class: 'truck', lane: 1, distanceZ: 55.0, lateralOffset: 0.8, speedKmh: 52.0, color: '#FFB800' },
          { id: 103, class: 'car', lane: -1, distanceZ: 25.0, lateralOffset: -0.85, speedKmh: 76.0, color: '#A855F7' }
        ];
      }
      setCallbacks(fcb, tcb) {
        this.frameCallback = fcb;
        this.telemetryCallback = tcb;
      }
      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastTime = performance.now();
        this.loop();
        this.telInterval = setInterval(() => this.tickTelemetry(), 50);
      }
      stop() {
        this.isRunning = false;
        if (this.animId) cancelAnimationFrame(this.animId);
        if (this.telInterval) clearInterval(this.telInterval);
      }
      injectFault(payload) {
        const fault = payload.faultType || payload.action;
        const dur = (payload.durationSec || 8) * 1000;
        if (payload.action === 'reset_simulation' || payload.action === 'clear_faults') {
          this.activeFaults.clear();
          this.egoSpeed = 68.4;
          this.brakePressure = 0;
          this.objects = [
            { id: 101, class: 'car', lane: 0, distanceZ: 38.0, lateralOffset: 0.0, speedKmh: 65.0, color: '#00F0FF' },
            { id: 102, class: 'truck', lane: 1, distanceZ: 55.0, lateralOffset: 0.8, speedKmh: 52.0, color: '#FFB800' },
            { id: 103, class: 'car', lane: -1, distanceZ: 25.0, lateralOffset: -0.85, speedKmh: 76.0, color: '#A855F7' }
          ];
          return;
        }
        if (payload.action === 'emergency_takeover') {
          this.activeFaults.set('manual_override', { start: Date.now(), dur: 15000 });
          return;
        }
        if (fault === 'cut_in_vehicle') {
          this.objects.unshift({ id: 999, class: 'car', lane: 0, distanceZ: 14.5, lateralOffset: 0.15, speedKmh: 42.0, color: '#FF2A6D' });
        } else if (fault === 'pedestrian_jaywalking') {
          this.objects.push({ id: 777, class: 'pedestrian', lane: 0, distanceZ: 22.0, lateralOffset: -1.2, speedKmh: 6.0, color: '#FF2A6D' });
        } else if (fault === 'sudden_brake') {
          const lead = this.objects.find(o => o.lane === 0);
          if (lead) { lead.speedKmh = 18.0; lead.distanceZ = Math.min(lead.distanceZ, 18.0); }
        }
        this.activeFaults.set(fault, { start: Date.now(), dur });
      }
      loop = () => {
        if (!this.isRunning) return;
        const now = performance.now();
        const dt = Math.min(0.1, (now - (this.lastTime || now)) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.render();
        this.canvas.toBlob(blob => {
          if (blob && this.frameCallback) this.frameCallback(blob);
        }, 'image/jpeg', 0.82);
        this.animId = requestAnimationFrame(this.loop);
      }
      update(dt) {
        this.frameCount++;
        const now = Date.now();
        for (const [k, v] of this.activeFaults.entries()) {
          if (now - v.start > v.dur) this.activeFaults.delete(k);
        }
        for (let i = this.objects.length - 1; i >= 0; i--) {
          const obj = this.objects[i];
          const relMps = ((this.egoSpeed - obj.speedKmh) * 1000) / 3600;
          obj.distanceZ -= relMps * dt;
          if (obj.distanceZ < 4.0 || obj.distanceZ > 120.0) {
            if (obj.id >= 700) this.objects.splice(i, 1);
            else { obj.distanceZ = 80 + Math.random() * 25; }
          }
        }
        const lead = this.objects.find(o => o.lane === 0 && o.distanceZ > 0);
        const leadDist = lead ? lead.distanceZ : 999;
        if (this.activeFaults.has('manual_override')) {
          this.egoSpeed = Math.max(0, this.egoSpeed - 35 * dt);
          this.brakePressure = 90;
        } else if (leadDist < 18.0) {
          this.targetSpeed = Math.max(20, (lead?.speedKmh || 40) - 10);
          this.brakePressure = Math.min(100, Math.round((20 - leadDist) * 12));
          this.egoSpeed = Math.max(this.targetSpeed, this.egoSpeed - 22 * dt);
        } else {
          this.brakePressure = 0;
          this.targetSpeed = this.activeFaults.has('weather_degradation') ? 55 : 72;
          if (this.egoSpeed < this.targetSpeed) this.egoSpeed = Math.min(this.targetSpeed, this.egoSpeed + 8 * dt);
        }
        this.steering = Math.sin(this.frameCount * 0.03) * 1.2;
        this.roadOffset += (this.egoSpeed * 1000 / 3600) * dt * 8;
      }
      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const horizon = h * 0.46;
        const cx = w * 0.5;

        // Sky & Horizon
        ctx.fillStyle = '#08101E';
        ctx.fillRect(0, 0, w, horizon);
        ctx.fillStyle = '#060B14';
        for (let bx = 0; bx < w; bx += 32) {
          const bh = 20 + Math.sin(bx * 0.1) * 18;
          ctx.fillRect(bx, horizon - bh, 28, bh);
        }

        // Road
        ctx.fillStyle = '#090E17';
        ctx.fillRect(0, horizon, w, h - horizon);
        ctx.beginPath();
        ctx.moveTo(cx - 70, horizon);
        ctx.lineTo(cx + 70, horizon);
        ctx.lineTo(w + 350, h);
        ctx.lineTo(-350, h);
        ctx.closePath();
        ctx.fillStyle = '#111827';
        ctx.fill();

        // Glowing Curb Lines
        ctx.strokeStyle = '#00F0FF55';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 70, horizon); ctx.lineTo(-350, h);
        ctx.moveTo(cx + 70, horizon); ctx.lineTo(w + 350, h);
        ctx.stroke();

        // Moving Dash lines
        [-0.35, 0.35].forEach(laneX => {
          ctx.strokeStyle = '#FACC15';
          ctx.lineWidth = 3;
          for (let s = 0; s < 12; s++) {
            const prog = (s / 12 + (this.roadOffset % 100) / 100) % 1;
            const p1 = Math.pow(prog, 2.2);
            const p2 = Math.pow(Math.min(1, prog + 0.04), 2.2);
            const y1 = horizon + p1 * (h - horizon);
            const y2 = horizon + p2 * (h - horizon);
            const sp1 = (y1 - horizon) / (h - horizon);
            const sp2 = (y2 - horizon) / (h - horizon);
            ctx.beginPath();
            ctx.moveTo(cx + laneX * 80 + laneX * 480 * sp1, y1);
            ctx.lineTo(cx + laneX * 80 + laneX * 480 * sp2, y2);
            ctx.stroke();
          }
        });

        // Draw 3D Vehicles
        const sorted = [...this.objects].sort((a, b) => b.distanceZ - a.distanceZ);
        sorted.forEach(obj => {
          const scale = Math.max(0.1, Math.min(1.3, 28 / (obj.distanceZ + 5)));
          const yScreen = horizon + (h - horizon) * Math.pow(Math.max(0.02, 1 - obj.distanceZ / 100), 1.8);
          const sp = (yScreen - horizon) / (h - horizon);
          const xScreen = cx + (obj.lane * 140 + obj.lateralOffset * 100) * sp * 2.2;
          const ow = (obj.class === 'truck' ? 110 : obj.class === 'pedestrian' ? 35 : 90) * scale;
          const oh = (obj.class === 'truck' ? 90 : obj.class === 'pedestrian' ? 75 : 65) * scale;

          ctx.save();
          ctx.translate(xScreen, yScreen);
          if (obj.class === 'pedestrian') {
            ctx.fillStyle = '#FFB800';
            ctx.beginPath(); ctx.arc(0, -oh * 0.85, ow * 0.35, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(-ow * 0.25, -oh * 0.65, ow * 0.5, oh * 0.4);
            ctx.fillRect(-ow * 0.2, -oh * 0.25, ow * 0.15, oh * 0.25);
            ctx.fillRect(ow * 0.05, -oh * 0.25, ow * 0.15, oh * 0.25);
          } else {
            ctx.fillStyle = obj.color;
            ctx.fillRect(-ow / 2, -oh, ow, oh * 0.75);
            ctx.fillStyle = '#050B14';
            ctx.fillRect(-ow * 0.38, -oh * 0.95, ow * 0.76, oh * 0.35);
            ctx.fillStyle = '#FF2A6D';
            ctx.fillRect(-ow * 0.45, -oh * 0.45, ow * 0.22, oh * 0.18);
            ctx.fillRect(ow * 0.23, -oh * 0.45, ow * 0.22, oh * 0.18);
          }
          ctx.restore();
        });

        // Weather & Blindspot Overlay
        if (this.activeFaults.has('weather_degradation')) {
          ctx.fillStyle = 'rgba(25, 40, 60, 0.45)';
          ctx.fillRect(0, 0, w, h);
        }
        if (this.activeFaults.has('sensor_blindspot')) {
          ctx.fillStyle = 'rgba(255, 0, 50, 0.3)';
          ctx.fillRect(w * 0.6, 0, w * 0.4, h);
          ctx.fillStyle = '#FF2A6D';
          ctx.font = 'bold 18px monospace';
          ctx.fillText('[SENSOR OCCLUDED - LIDAR/CAM R-SECTOR]', w * 0.62, 50);
        }

        // Hood
        ctx.fillStyle = '#060B12';
        ctx.beginPath();
        ctx.moveTo(cx - 320, h); ctx.lineTo(cx - 160, h - 35);
        ctx.lineTo(cx + 160, h - 35); ctx.lineTo(cx + 320, h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#00F0FF44'; ctx.lineWidth = 2; ctx.stroke();
      }
      tickTelemetry() {
        if (!this.telemetryCallback) return;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const horizon = h * 0.46;
        const cx = w * 0.5;

        const tracked = [];
        let minTtc = Infinity;
        let mostCrit = null;

        this.objects.forEach(obj => {
          const scale = Math.max(0.1, Math.min(1.3, 28 / (obj.distanceZ + 5)));
          const yScreen = horizon + (h - horizon) * Math.pow(Math.max(0.02, 1 - obj.distanceZ / 100), 1.8);
          const sp = (yScreen - horizon) / (h - horizon);
          const xScreen = cx + (obj.lane * 140 + obj.lateralOffset * 100) * sp * 2.2;
          const ow = (obj.class === 'truck' ? 110 : obj.class === 'pedestrian' ? 35 : 90) * scale;
          const oh = (obj.class === 'truck' ? 90 : obj.class === 'pedestrian' ? 75 : 65) * scale;

          const relMps = ((this.egoSpeed - obj.speedKmh) * 1000) / 3600;
          let ttc = relMps > 0.5 && obj.distanceZ > 0 ? obj.distanceZ / relMps : Infinity;
          let risk = ttc < 2.5 || (obj.lane === 0 && obj.distanceZ < 18) ? 'CRITICAL' : ttc < 4.5 ? 'CAUTION' : 'SAFE';

          const tObj = {
            id: obj.id,
            class: obj.class,
            bbox: [Math.round(xScreen - ow/2), Math.round(yScreen - oh), Math.round(xScreen + ow/2), Math.round(yScreen)],
            confidence: 0.96,
            distance: Math.round(obj.distanceZ * 10) / 10,
            relativeVelocity: Math.round(relMps * 10) / 10,
            ttc: ttc === Infinity ? 99.9 : Math.round(ttc * 10) / 10,
            riskLevel: risk,
            trajectory: [
              { x: xScreen, y: yScreen },
              { x: xScreen + (obj.lane * 8), y: yScreen - 25 },
              { x: xScreen + (obj.lane * 16), y: yScreen - 50 }
            ],
            position3D: { x: obj.lane * 3.5 + obj.lateralOffset * 2.0, y: 0, z: obj.distanceZ }
          };
          tracked.push(tObj);
          if (ttc < minTtc && obj.lane === 0) {
            minTtc = ttc;
            mostCrit = tObj;
          }
        });

        let action = 'Maintain';
        let urgency = 'low';
        const reasoning = {};
        const lead = tracked.find(o => Math.abs(o.position3D.x) < 1.8 && o.position3D.z < 25);
        if (this.activeFaults.has('manual_override')) {
          action = 'Emergency Braking'; urgency = 'critical';
          reasoning['Maintain'] = 'REJECTED: Operator takeover override engaged.';
          reasoning['Brake'] = 'ACCEPTED: Maximum deceleration requested.';
        } else if (lead && (lead.ttc < 2.2 || lead.distance < 16)) {
          urgency = 'critical';
          action = lead.ttc < 1.5 ? 'Swerve' : 'Emergency Braking';
          reasoning['Maintain'] = `REJECTED: Collision risk with Target #${lead.id} in ${lead.ttc.toFixed(1)}s.`;
          reasoning['Brake'] = 'OPTIMAL: Full ABS brake deceleration active.';
          reasoning['Swerve'] = 'STANDBY: Adjacent lane verification in progress.';
        } else if (lead && lead.distance < 28) {
          action = 'Brake'; urgency = 'medium';
          reasoning['Maintain'] = `CAUTION: Approaching lead Target #${lead.id} (${lead.distance.toFixed(1)}m).`;
          reasoning['Brake'] = 'OPTIMAL: Smooth regenerative braking applied.';
        } else {
          action = 'Maintain'; urgency = 'low';
          reasoning['Maintain'] = 'OPTIMAL: Forward travel corridor clear.';
        }

        const packet = {
          timestamp: Date.now(),
          frameId: this.frameCount,
          objects: tracked,
          decision: {
            id: `dec-${this.frameCount}`,
            timestamp: new Date().toTimeString().split(' ')[0] + `.${Math.floor(Date.now()%1000/100)}`,
            action,
            confidence: 0.96,
            targetSpeedKmh: Math.round(this.targetSpeed),
            reasoning,
            primaryReason: reasoning[action] || 'Nominal autonomous driving.',
            urgency
          },
          metrics: {
            speedKmh: Math.round(this.egoSpeed * 10) / 10,
            speedMph: Math.round(this.egoSpeed * 0.621371 * 10) / 10,
            targetSpeedKmh: Math.round(this.targetSpeed),
            steeringAngleDeg: Math.round(this.steering * 10) / 10,
            accelerationG: action.includes('Brake') ? -0.45 : 0.08,
            lateralG: Math.round(this.steering * 0.02 * 100) / 100,
            brakePressurePct: this.brakePressure,
            throttlePct: this.throttle,
            gear: 'D',
            driveMode: this.activeFaults.has('manual_override') ? 'MANUAL_OVERRIDE' : 'AUTONOMOUS',
            batterySoc: 89,
            distanceToLeadVehicle: lead ? lead.distance : 99.9,
            sensorStatus: { camera: 'HEALTHY', lidar: 'HEALTHY', radar: 'HEALTHY', imu: 'HEALTHY', gnss: 'HEALTHY' }
          },
          ttcAlert: {
            level: minTtc < 2.5 ? 'CRITICAL' : minTtc < 4.5 ? 'CAUTION' : 'SAFE',
            ttcSeconds: minTtc === Infinity ? 99.9 : Math.round(minTtc * 10) / 10,
            targetId: mostCrit ? mostCrit.id : null,
            targetClass: mostCrit ? mostCrit.class : null,
            distanceMeters: mostCrit ? mostCrit.distance : null,
            message: minTtc < 2.5 ? `CRITICAL: TTC Hazard with Target #${mostCrit?.id} (${mostCrit?.distance}m)` : 'All corridors clear.'
          },
          activeFaults: Array.from(this.activeFaults.keys())
        };
        this.telemetryCallback(packet);
      }
    }
    const mockEngine = new MockEngine();

    // --- Main App React Component ---
    function App() {
      const [isMockMode, setIsMockMode] = useState(true);
      const [telemetry, setTelemetry] = useState(null);
      const [activeFaults, setActiveFaults] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [logs, setLogs] = useState([]);
      const [filterAction, setFilterAction] = useState('ALL');
      const [autoScroll, setAutoScroll] = useState(true);
      const [customJson, setCustomJson] = useState(JSON.stringify({ action: "inject_fault", fault_type: "cut_in_vehicle", duration_sec: 8 }, null, 2));

      const videoCanvasRef = useRef(null);
      const overlayCanvasRef = useRef(null);
      const latestFrameRef = useRef(null);
      const latestTelemetryRef = useRef(null);
      const terminalEndRef = useRef(null);
      const bitmapRef = useRef(null);

      // WebSocket status
      const [videoWsStatus, setVideoWsStatus] = useState({ status: 'CONNECTING', fps: 0 });
      const [telWsStatus, setTelWsStatus] = useState({ status: 'CONNECTING', fps: 0, latency: 0 });
      const telWsRef = useRef(null);
      const videoWsRef = useRef(null);

      // Connect WebSockets
      useEffect(() => {
        const connectSockets = () => {
          try {
            const vws = new WebSocket('ws://localhost:8000/ws/video');
            vws.binaryType = 'arraybuffer';
            vws.onopen = () => setVideoWsStatus({ status: 'CONNECTED', fps: 30 });
            vws.onmessage = (e) => {
              if (!isMockMode) latestFrameRef.current = e.data;
            };
            vws.onclose = () => setVideoWsStatus({ status: 'DISCONNECTED', fps: 0 });
            vws.onerror = () => setVideoWsStatus({ status: 'ERROR', fps: 0 });
            videoWsRef.current = vws;

            const tws = new WebSocket('ws://localhost:8000/ws/telemetry');
            tws.onopen = () => setTelWsStatus({ status: 'CONNECTED', fps: 20, latency: 2 });
            tws.onmessage = (e) => {
              try {
                const data = JSON.parse(e.data);
                if (data.decision && !isMockMode) {
                  latestTelemetryRef.current = data;
                  setTelemetry(data);
                  if (data.activeFaults) setActiveFaults(data.activeFaults);
                }
              } catch(err){}
            };
            tws.onclose = () => setTelWsStatus({ status: 'DISCONNECTED', fps: 0, latency: 0 });
            tws.onerror = () => setTelWsStatus({ status: 'ERROR', fps: 0, latency: 0 });
            telWsRef.current = tws;
          } catch(e){}
        };
        connectSockets();

        mockEngine.setCallbacks(
          (blob) => { if (isMockMode) latestFrameRef.current = blob; },
          (packet) => {
            if (isMockMode) {
              latestTelemetryRef.current = packet;
              setTelemetry(packet);
              if (packet.activeFaults) setActiveFaults(packet.activeFaults);
            }
          }
        );
        mockEngine.start();

        return () => {
          mockEngine.stop();
          if (videoWsRef.current) videoWsRef.current.close();
          if (telWsRef.current) telWsRef.current.close();
        };
      }, [isMockMode]);

      // Logging
      useEffect(() => {
        if (!telemetry?.decision) return;
        const dec = telemetry.decision;
        const entry = {
          id: `${dec.id}-${Date.now()}`,
          timestamp: dec.timestamp,
          action: dec.action,
          confidence: dec.confidence,
          targetSpeed: dec.targetSpeedKmh,
          primaryReason: dec.primaryReason,
          urgency: dec.urgency
        };
        setLogs(prev => [...prev.slice(-150), entry]);
      }, [telemetry?.decision?.id]);

      useEffect(() => {
        if (autoScroll && terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs, autoScroll]);

      // Canvas Rendering Loop
      useEffect(() => {
        let active = true;
        let isDecoding = false;

        const renderLoop = () => {
          if (!active) return;
          const vCanvas = videoCanvasRef.current;
          const oCanvas = overlayCanvasRef.current;
          const tel = latestTelemetryRef.current;

          if (latestFrameRef.current && !isDecoding) {
            isDecoding = true;
            const blob = latestFrameRef.current instanceof Blob ? latestFrameRef.current : new Blob([latestFrameRef.current], { type: 'image/jpeg' });
            createImageBitmap(blob).then(bmp => {
              if (bitmapRef.current) bitmapRef.current.close();
              bitmapRef.current = bmp;
              isDecoding = false;
            }).catch(() => { isDecoding = false; });
          }

          if (vCanvas && bitmapRef.current) {
            const ctx = vCanvas.getContext('2d');
            ctx.drawImage(bitmapRef.current, 0, 0, vCanvas.width, vCanvas.height);
          }

          if (oCanvas && tel) {
            const ctx = oCanvas.getContext('2d');
            ctx.clearRect(0, 0, oCanvas.width, oCanvas.height);
            drawOverlays(ctx, oCanvas.width, oCanvas.height, tel);
          }

          requestAnimationFrame(renderLoop);
        };
        requestAnimationFrame(renderLoop);
        return () => { active = false; };
      }, []);

      const drawOverlays = (ctx, w, h, tel) => {
        const horizon = h * 0.46;
        const cx = w * 0.5;

        // Trajectory Corridor
        const isEmergency = tel.decision.action.includes('Brake');
        ctx.fillStyle = isEmergency ? 'rgba(255, 42, 109, 0.25)' : 'rgba(0, 240, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(cx - 130, h);
        ctx.lineTo(cx - 20, horizon + 20);
        ctx.lineTo(cx + 20, horizon + 20);
        ctx.lineTo(cx + 130, h);
        ctx.closePath();
        ctx.fill();

        // Draw Bounding Boxes & Trajectories
        tel.objects.forEach(obj => {
          const [xmin, ymin, xmax, ymax] = obj.bbox;
          const bw = xmax - xmin;
          const bh = ymax - ymin;
          const isCrit = obj.riskLevel === 'CRITICAL';
          const isCaut = obj.riskLevel === 'CAUTION';
          const col = isCrit ? '#FF2A6D' : isCaut ? '#FFB800' : '#00F0FF';

          // Trajectory Spline
          if (obj.trajectory) {
            ctx.strokeStyle = col;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(obj.trajectory[0].x, obj.trajectory[0].y);
            obj.trajectory.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Cyber Corner Brackets
          ctx.strokeStyle = col;
          ctx.lineWidth = isCrit ? 2.5 : 1.5;
          ctx.fillStyle = isCrit ? 'rgba(255,42,109,0.15)' : 'rgba(0,240,255,0.06)';
          ctx.fillRect(xmin, ymin, bw, bh);

          const cLen = Math.min(16, bw * 0.3);
          ctx.beginPath();
          ctx.moveTo(xmin, ymin + cLen); ctx.lineTo(xmin, ymin); ctx.lineTo(xmin + cLen, ymin);
          ctx.moveTo(xmax - cLen, ymin); ctx.lineTo(xmax, ymin); ctx.lineTo(xmax, ymin + cLen);
          ctx.moveTo(xmin, ymax - cLen); ctx.lineTo(xmin, ymax); ctx.lineTo(xmin + cLen, ymax);
          ctx.moveTo(xmax - cLen, ymax); ctx.lineTo(xmax, ymax); ctx.lineTo(xmax, ymax - cLen);
          ctx.stroke();

          // Label Pill
          const tag = `#${obj.id} ${obj.class.toUpperCase()} ${obj.distance}m [TTC ${obj.ttc > 50 ? 'SAFE' : obj.ttc + 's'}]`;
          ctx.font = 'bold 11px JetBrains Mono, monospace';
          const tw = ctx.measureText(tag).width + 12;
          ctx.fillStyle = 'rgba(6, 11, 20, 0.9)';
          ctx.fillRect(xmin, Math.max(8, ymin - 22), tw, 20);
          ctx.strokeStyle = col;
          ctx.strokeRect(xmin, Math.max(8, ymin - 22), tw, 20);
          ctx.fillStyle = isCrit ? '#FF2A6D' : '#E2E8F0';
          ctx.fillText(tag, xmin + 6, Math.max(8, ymin - 22) + 14);
        });
      };

      const sendFault = (payload) => {
        if (isMockMode) {
          mockEngine.injectFault(payload);
        } else if (telWsRef.current && telWsRef.current.readyState === WebSocket.OPEN) {
          telWsRef.current.send(JSON.stringify(payload));
        }
      };

      const speed = telemetry?.metrics?.speedKmh || 0;
      const ttcLevel = telemetry?.ttcAlert?.level || 'SAFE';

      return (
        <div className="min-h-screen bg-[#05070B] text-slate-100 flex flex-col antialiased">
          {/* Header */}
          <header className="bg-[#080D17]/90 backdrop-blur-md border-b border-[#1A2638] px-4 py-2.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-bold font-mono">
                AV
              </div>
              <div>
                <h1 className="text-sm sm:text-base font-bold font-mono text-slate-100 flex items-center gap-2">
                  <span>AURA-AV</span>
                  <span className="text-[10px] px-1.5 py-0.5 bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 rounded">
                    MISSION CONTROL HUD
                  </span>
                </h1>
                <p className="text-[11px] font-mono text-slate-400">EXPLAINABLE AUTONOMOUS DECISION SUPPORT SYSTEM</p>
              </div>
            </div>

            {/* WebSocket Diagnostic Badges */}
            <div className="flex items-center gap-3 bg-[#0B1220] px-3 py-1.5 rounded-lg border border-[#1E2D45] text-xs font-mono">
              <div className="flex items-center gap-2 pr-3 border-r border-[#1E2D45]">
                <span className="text-slate-400">/ws/video:</span>
                <span className={`px-1.5 py-0.2 rounded text-[10px] ${isMockMode ? 'bg-purple-500/20 text-purple-300' : videoWsStatus.status === 'CONNECTED' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                  {isMockMode ? 'SYNTHETIC 60 FPS' : videoWsStatus.status}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-slate-400">/ws/telemetry:</span>
                <span className={`px-1.5 py-0.2 rounded text-[10px] ${isMockMode ? 'bg-purple-500/20 text-purple-300' : telWsStatus.status === 'CONNECTED' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                  {isMockMode ? '20 Hz (<1ms)' : telWsStatus.status}
                </span>
              </div>
            </div>

            {/* Quick Actions */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsMockMode(!isMockMode)}
                className={`px-3 py-1.5 rounded text-xs font-mono font-medium border ${isMockMode ? 'bg-purple-600/20 text-purple-300 border-purple-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
              >
                {isMockMode ? '✨ SIMULATOR MODE' : '🔗 LIVE BACKEND'}
              </button>
              <button
                onClick={() => {
                  audioManager.playCriticalAlert();
                  sendFault({ action: 'emergency_takeover' });
                }}
                className="px-3 py-1.5 rounded bg-rose-600 hover:bg-rose-500 text-white text-xs font-mono font-bold shadow-[0_0_15px_rgba(255,42,109,0.4)]"
              >
                E-STOP
              </button>
            </div>
          </header>

          {/* Main Content Grid */}
          <main className="flex-1 p-3 sm:p-4 max-w-[1920px] w-full mx-auto flex flex-col gap-4">
            {/* Top Row: Video Feed Canvas + Telemetry Sidebar */}
            <div className="flex flex-col lg:flex-row gap-4 items-stretch">
              {/* Central Video & Overlay Canvas */}
              <div className="relative flex-1 bg-[#05080E] rounded-xl border border-[#1A2638] overflow-hidden flex flex-col shadow-2xl">
                <div className="relative w-full aspect-video bg-black overflow-hidden flex items-center justify-center">
                  <canvas ref={videoCanvasRef} width={1280} height={720} className="absolute inset-0 w-full h-full object-contain" />
                  <canvas ref={overlayCanvasRef} width={1280} height={720} className="absolute inset-0 w-full h-full object-contain pointer-events-none" />
                  
                  <div className="absolute top-3 left-3 flex items-center gap-2 px-2.5 py-1 rounded bg-[#070D18]/80 backdrop-blur-md border border-[#1E2D45] text-xs font-mono">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span className="text-slate-300">FRONT CAMERA 120° [1280x720]</span>
                  </div>
                </div>
              </div>

              {/* Telemetry Sidebar */}
              <aside className="w-full lg:w-80 flex flex-col gap-3">
                {/* Speedometer Card */}
                <div className="bg-[#080D17]/90 backdrop-blur-md rounded-xl border border-[#1A2638] p-4 flex flex-col gap-2 shadow-lg">
                  <div className="flex justify-between items-center border-b border-[#1A2638] pb-2 text-xs font-mono">
                    <span className="text-cyan-400 font-bold">VEHICLE SPEED</span>
                    <span className="text-emerald-400 font-bold">{telemetry?.metrics?.driveMode || 'AUTONOMOUS'}</span>
                  </div>
                  <div className="flex items-baseline justify-center py-2 gap-2">
                    <span className="text-5xl font-bold font-mono text-slate-100">{speed.toFixed(0)}</span>
                    <span className="text-sm font-mono text-cyan-400">KM/H</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-xs font-mono pt-2 border-t border-[#131F33]">
                    <div className="text-slate-400">STEERING: <span className="text-slate-200 font-bold">{telemetry?.metrics?.steeringAngleDeg}°</span></div>
                    <div className="text-slate-400">BRAKE: <span className="text-rose-400 font-bold">{telemetry?.metrics?.brakePressurePct}%</span></div>
                  </div>
                </div>

                {/* TTC Alert Card */}
                <div className={`rounded-xl border p-4 flex flex-col gap-2 transition-all ${ttcLevel === 'CRITICAL' ? 'bg-rose-950/40 border-rose-500 animate-pulse' : ttcLevel === 'CAUTION' ? 'bg-amber-950/30 border-amber-500' : 'bg-[#080D17]/90 border-[#1A2638]'}`}>
                  <div className="flex justify-between items-center text-xs font-mono font-bold">
                    <span className="text-slate-200">TTC COLLISION RADAR</span>
                    <span className={`px-2 py-0.5 rounded ${ttcLevel === 'CRITICAL' ? 'bg-rose-500 text-white' : ttcLevel === 'CAUTION' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                      {ttcLevel}
                    </span>
                  </div>
                  <div className="text-3xl font-bold font-mono text-slate-100 py-1">
                    {telemetry?.ttcAlert?.ttcSeconds && telemetry.ttcAlert.ttcSeconds < 50 ? `${telemetry.ttcAlert.ttcSeconds.toFixed(1)}s` : 'CLEAR'}
                  </div>
                  <div className="text-xs font-mono text-slate-400 leading-tight">
                    {telemetry?.ttcAlert?.message || 'Clear forward trajectory.'}
                  </div>
                </div>

                {/* Object Breakdown */}
                <div className="bg-[#080D17]/90 backdrop-blur-md rounded-xl border border-[#1A2638] p-4 flex flex-col gap-2 text-xs font-mono shadow-lg">
                  <div className="flex justify-between items-center border-b border-[#1A2638] pb-1.5 font-bold">
                    <span className="text-slate-200">PERCEPTION TARGETS</span>
                    <span className="text-cyan-400">{telemetry?.objects?.length || 0} TRACKED</span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div className="p-2 rounded bg-[#050A14] flex justify-between"><span>Cars</span><span className="font-bold">{telemetry?.objects?.filter(o => o.class==='car').length || 0}</span></div>
                    <div className="p-2 rounded bg-[#050A14] flex justify-between"><span>Pedestrians</span><span className="font-bold">{telemetry?.objects?.filter(o => o.class==='pedestrian').length || 0}</span></div>
                    <div className="p-2 rounded bg-[#050A14] flex justify-between"><span>Trucks</span><span className="font-bold">{telemetry?.objects?.filter(o => o.class==='truck').length || 0}</span></div>
                    <div className="p-2 rounded bg-[#050A14] flex justify-between"><span>Lead Dist</span><span className="font-bold">{telemetry?.metrics?.distanceToLeadVehicle < 90 ? telemetry.metrics.distanceToLeadVehicle.toFixed(1) + 'm' : '--'}</span></div>
                  </div>
                </div>
              </aside>
            </div>

            {/* Bottom Row: Decision Log & Control Panel */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
              {/* Decision Log */}
              <section className="bg-[#080D17]/90 backdrop-blur-md rounded-xl border border-[#1A2638] flex flex-col shadow-lg overflow-hidden h-[340px]">
                <div className="bg-[#0A101D] px-4 py-2.5 border-b border-[#1A2638] flex items-center justify-between text-xs font-mono">
                  <span className="text-cyan-400 font-bold">AV DECISION STREAM & EXPLAINABILITY LOG</span>
                  <div className="flex items-center gap-1">
                    {['ALL', 'CRITICAL', 'BRAKE', 'MAINTAIN'].map(f => (
                      <button
                        key={f}
                        onClick={() => setFilterAction(f)}
                        className={`px-2 py-0.5 rounded ${filterAction === f ? 'bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/40' : 'text-slate-400'}`}
                      >
                        {f}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="flex-1 p-3 overflow-y-auto font-mono text-xs space-y-1.5 bg-[#05070D]">
                  {logs.filter(l => filterAction === 'ALL' || l.action.toUpperCase().includes(filterAction)).map(log => (
                    <div key={log.id} className="p-2 rounded bg-[#090F1B] border border-[#141F30] flex flex-col gap-1">
                      <div className="flex items-center gap-2">
                        <span className="text-slate-500">[{log.timestamp}]</span>
                        <span className={`px-1.5 py-0.2 rounded font-bold ${log.urgency === 'critical' ? 'bg-rose-500/20 text-rose-300' : log.action.includes('Brake') ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                          {log.action.toUpperCase()}
                        </span>
                        <span className="text-cyan-400">CONF: {(log.confidence * 100).toFixed(0)}%</span>
                      </div>
                      <div className="text-slate-300">&gt; {log.primaryReason}</div>
                    </div>
                  ))}
                  <div ref={terminalEndRef} />
                </div>
              </section>

              {/* Fault Injection Control Panel */}
              <section className="bg-[#080D17]/90 backdrop-blur-md rounded-xl border border-[#1A2638] p-4 flex flex-col gap-3 shadow-lg">
                <div className="flex justify-between items-center border-b border-[#1A2638] pb-2 text-xs font-mono">
                  <span className="text-cyan-400 font-bold">EDGE-CASE & FAULT INJECTION DISPATCHER</span>
                  <span className="text-slate-400">BI-DIRECTIONAL WS</span>
                </div>
                <div className="grid grid-cols-3 gap-2 text-xs font-mono">
                  <button
                    onClick={() => sendFault({ action: 'inject_fault', fault_type: 'cut_in_vehicle', duration_sec: 8 })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-cyan-500 text-slate-200 hover:bg-[#0E1626] font-bold"
                  >
                    ⚠️ Cut-In Vehicle
                  </button>
                  <button
                    onClick={() => sendFault({ action: 'inject_fault', fault_type: 'pedestrian_jaywalking', duration_sec: 8 })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-cyan-500 text-slate-200 hover:bg-[#0E1626] font-bold"
                  >
                    🚶 Jaywalking
                  </button>
                  <button
                    onClick={() => sendFault({ action: 'inject_fault', fault_type: 'sudden_brake', duration_sec: 8 })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-cyan-500 text-slate-200 hover:bg-[#0E1626] font-bold"
                  >
                    🛑 Hard Brake
                  </button>
                  <button
                    onClick={() => sendFault({ action: 'inject_fault', fault_type: 'weather_degradation', duration_sec: 10 })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-cyan-500 text-slate-200 hover:bg-[#0E1626] font-bold"
                  >
                    🌫️ Weather Degrade
                  </button>
                  <button
                    onClick={() => sendFault({ action: 'inject_fault', fault_type: 'sensor_blindspot', duration_sec: 8 })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-cyan-500 text-slate-200 hover:bg-[#0E1626] font-bold"
                  >
                    🚫 Blindspot Fault
                  </button>
                  <button
                    onClick={() => sendFault({ action: 'reset_simulation' })}
                    className="p-3 rounded-lg bg-[#0A101D] border border-[#1A2638] hover:border-emerald-500 text-emerald-400 hover:bg-[#0E1626] font-bold"
                  >
                    🔄 Reset Nominal
                  </button>
                </div>

                {/* Custom JSON Dispatcher */}
                <div className="flex flex-col gap-2 pt-2 border-t border-[#162234]">
                  <textarea
                    value={customJson}
                    onChange={(e) => setCustomJson(e.target.value)}
                    rows={2}
                    className="bg-[#03060B] border border-[#1A2638] rounded p-2 text-xs font-mono text-cyan-300 resize-none"
                  />
                  <button
                    onClick={() => {
                      try { sendFault(JSON.parse(customJson)); } catch(e){}
                    }}
                    className="px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white rounded font-mono text-xs font-bold"
                  >
                    TRANSMIT JSON PAYLOAD OVER /ws/telemetry
                  </button>
                </div>
              </section>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
