<body class="bg-[#05070B] text-slate-100 font-sans antialiased select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Audio Sound Synthesis ---
    class AudioManager {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.lastAlert = 0;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playBeep(freq = 880, dur = 0.08, type = 'sine') {
        if (this.isMuted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      }
      playCriticalAlert() {
        const now = Date.now();
        if (this.isMuted || now - this.lastAlert < 1500) return;
        this.lastAlert = now;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(950, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.15);
          osc.frequency.linearRampToValueAtTime(950, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.35);
        } catch(e) {}
      }
    }
    const audioManager = new AudioManager();

    // --- Synthetic Procedural Engine ---
    class MockEngine {
      constructor() {
        this.isRunning = false;
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1280;
        this.canvas.height = 720;
        this.ctx = this.canvas.getContext('2d');
        this.frameCallback = null;
        this.telemetryCallback = null;
        this.frameCount = 0;
        this.egoSpeed = 68.4;
        this.targetSpeed = 70.0;
        this.steering = 0;
        this.brakePressure = 0;
        this.throttle = 45;
        this.roadOffset = 0;
        this.activeFaults = new Map();
        this.smoothedConfidence = { camera: 0.98, lidar: 0.96, radar: 0.95, imu: 0.99, gnss: 0.94 };
        this.confidenceHistory = [];
        this.eventMarkers = [];
        this.eventCounter = 0;
        this.lastFaultKeys = new Set();
        this.objects = [
          { id: 101, class: 'car', lane: 0, distanceZ: 38.0, lateralOffset: 0.0, speedKmh: 65.0, color: '#00F0FF' },
          { id: 102, class: 'truck', lane: 1, distanceZ: 55.0, lateralOffset: 0.8, speedKmh: 52.0, color: '#FFB800' },
          { id: 103, class: 'car', lane: -1, distanceZ: 25.0, lateralOffset: -0.85, speedKmh: 76.0, color: '#A855F7' }
        ];
      }
      setCallbacks(fcb, tcb) {
        this.frameCallback = fcb;
        this.telemetryCallback = tcb;
      }
      start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastTime = performance.now();
        this.loop();
        this.telInterval = setInterval(() => this.tickTelemetry(), 50);
      }
      stop() {
        this.isRunning = false;
        if (this.animId) cancelAnimationFrame(this.animId);
        if (this.telInterval) clearInterval(this.telInterval);
      }
      injectFault(payload) {
        const fault = payload.faultType || payload.action;
        const dur = (payload.durationSec || 8) * 1000;
        if (payload.action === 'reset_simulation' || payload.action === 'clear_faults') {
          this.activeFaults.clear();
          this.egoSpeed = 68.4;
          this.brakePressure = 0;
          this.objects = [
            { id: 101, class: 'car', lane: 0, distanceZ: 38.0, lateralOffset: 0.0, speedKmh: 65.0, color: '#00F0FF' },
            { id: 102, class: 'truck', lane: 1, distanceZ: 55.0, lateralOffset: 0.8, speedKmh: 52.0, color: '#FFB800' },
            { id: 103, class: 'car', lane: -1, distanceZ: 25.0, lateralOffset: -0.85, speedKmh: 76.0, color: '#A855F7' }
          ];
          return;
        }
        if (payload.action === 'emergency_takeover') {
          this.activeFaults.set('manual_override', { start: Date.now(), dur: 15000 });
          return;
        }
        if (fault === 'cut_in_vehicle') {
          this.objects.unshift({ id: 999, class: 'car', lane: 0, distanceZ: 14.5, lateralOffset: 0.15, speedKmh: 42.0, color: '#FF2A6D' });
        } else if (fault === 'pedestrian_jaywalking') {
          this.objects.push({ id: 777, class: 'pedestrian', lane: 0, distanceZ: 22.0, lateralOffset: -1.2, speedKmh: 6.0, color: '#FF2A6D' });
        } else if (fault === 'sudden_brake') {
          const lead = this.objects.find(o => o.lane === 0);
          if (lead) { lead.speedKmh = 18.0; lead.distanceZ = Math.min(lead.distanceZ, 18.0); }
        }
        this.activeFaults.set(fault, { start: Date.now(), dur });
      }
      loop = () => {
        if (!this.isRunning) return;
        const now = performance.now();
        const dt = Math.min(0.1, (now - (this.lastTime || now)) / 1000);
        this.lastTime = now;
        this.update(dt);
        this.render();
        this.canvas.toBlob(blob => {
          if (blob && this.frameCallback) this.frameCallback(blob);
        }, 'image/jpeg', 0.82);
        this.animId = requestAnimationFrame(this.loop);
      }
      update(dt) {
        this.frameCount++;
        const now = Date.now();
        for (const [k, v] of this.activeFaults.entries()) {
          if (now - v.start > v.dur) this.activeFaults.delete(k);
        }
        for (let i = this.objects.length - 1; i >= 0; i--) {
          const obj = this.objects[i];
          const relMps = ((this.egoSpeed - obj.speedKmh) * 1000) / 3600;
          obj.distanceZ -= relMps * dt;
          if (obj.distanceZ < 4.0 || obj.distanceZ > 120.0) {
            if (obj.id >= 700) this.objects.splice(i, 1);
            else { obj.distanceZ = 80 + Math.random() * 25; }
          }
        }
        const lead = this.objects.find(o => o.lane === 0 && o.distanceZ > 0);
        const leadDist = lead ? lead.distanceZ : 999;
        
        if (this.activeFaults.has('manual_override')) {
          this.egoSpeed = Math.max(0, this.egoSpeed - 45 * dt);
          this.brakePressure = 100;
        } else if (this.activeFaults.has('pedestrian_jaywalking')) {
          // Complete full emergency stop when jaywalker is crossing
          this.egoSpeed = Math.max(0, this.egoSpeed - 45 * dt);
          this.brakePressure = 100;
        } else if (this.activeFaults.has('sensor_blindspot')) {
          // Safety braking deceleration when blindspot fault occurs
          this.egoSpeed = Math.max(0, this.egoSpeed - 30 * dt);
          this.brakePressure = 85;
        } else if (leadDist < 18.0) {
          this.targetSpeed = Math.max(0, (lead?.speedKmh || 40) - 15);
          this.brakePressure = Math.min(100, Math.round((20 - leadDist) * 12));
          this.egoSpeed = Math.max(this.targetSpeed, this.egoSpeed - 30 * dt);
        } else {
          this.brakePressure = 0;
          this.targetSpeed = this.activeFaults.has('weather_degradation') ? 55 : 72;
          if (this.egoSpeed < this.targetSpeed) this.egoSpeed = Math.min(this.targetSpeed, this.egoSpeed + 8 * dt);
        }
        this.steering = Math.sin(this.frameCount * 0.03) * 1.2;
        this.roadOffset += (this.egoSpeed * 1000 / 3600) * dt * 8;
      }
      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const horizon = h * 0.46;
        const cx = w * 0.5;

        // Sky & Horizon
        ctx.fillStyle = '#08101E';
        ctx.fillRect(0, 0, w, horizon);
        ctx.fillStyle = '#060B14';
        for (let bx = 0; bx < w; bx += 32) {
          const bh = 20 + Math.sin(bx * 0.1) * 18;
          ctx.fillRect(bx, horizon - bh, 28, bh);
        }

        // Road surface
        ctx.fillStyle = '#181E2A';
        ctx.beginPath();
        ctx.moveTo(cx - 70, horizon); ctx.lineTo(cx + 70, horizon);
        ctx.lineTo(w + 300, h); ctx.lineTo(-300, h);
        ctx.closePath(); ctx.fill();

        // Curbs
        ctx.strokeStyle = '#00F0FF'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - 70, horizon); ctx.lineTo(-300, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + 70, horizon); ctx.lineTo(w + 300, h); ctx.stroke();

        // Moving Dash Lines (proportional to egoSpeed)
        const offset = this.roadOffset % 100;
        for (let s = 0; s < 12; s++) {
          const progress = ((s / 12) + (offset / 100)) % 1;
          const p1 = Math.pow(progress, 2.2);
          const p2 = Math.pow(Math.min(1, progress + 0.04), 2.2);
          const y1 = horizon + p1 * (h - horizon);
          const y2 = horizon + p2 * (h - horizon);
          const sp1 = (y1 - horizon) / (h - horizon);
          const sp2 = (y2 - horizon) / (h - horizon);

          [-0.35, 0.35].forEach(lx => {
            const x1 = cx + (lx * 80) + lx * 480 * sp1;
            const x2 = cx + (lx * 80) + lx * 480 * sp2;
            ctx.strokeStyle = '#FACC15'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          });
        }

        // Render Dynamic 3D Objects
        this.objects.forEach(obj => {
          const scale = Math.max(0.1, Math.min(1.3, 28 / (obj.distanceZ + 5)));
          const yScreen = horizon + (h - horizon) * Math.pow(Math.max(0.02, 1 - obj.distanceZ / 100), 1.8);
          const sp = (yScreen - horizon) / (h - horizon);
          const xScreen = cx + (obj.lane * 140 + obj.lateralOffset * 100) * sp * 2.2;
          const ow = (obj.class === 'truck' ? 110 : obj.class === 'pedestrian' ? 28 : 90) * scale;
          const oh = (obj.class === 'truck' ? 90 : obj.class === 'pedestrian' ? 68 : 65) * scale;

          ctx.save();
          ctx.translate(xScreen, yScreen);
          if (obj.class === 'pedestrian') {
            const stride = Math.sin(this.frameCount * 0.4) * 12 * scale;
            // Head
            ctx.fillStyle = '#FFC864';
            ctx.beginPath(); ctx.arc(0, -oh * 0.85, ow * 0.35, 0, Math.PI * 2); ctx.fill();
            // Torso
            ctx.fillStyle = '#FF3C64';
            ctx.fillRect(-ow * 0.35, -oh * 0.65, ow * 0.7, oh * 0.4);
            // Legs
            ctx.strokeStyle = '#288CFF'; ctx.lineWidth = Math.max(2, 4 * scale);
            ctx.beginPath(); ctx.moveTo(-ow * 0.15, -oh * 0.25); ctx.lineTo(-ow * 0.15 + stride, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ow * 0.15, -oh * 0.25); ctx.lineTo(ow * 0.15 - stride, 0); ctx.stroke();
          } else {
            ctx.fillStyle = obj.color;
            ctx.fillRect(-ow / 2, -oh, ow, oh * 0.75);
            ctx.fillStyle = '#050B14';
            ctx.fillRect(-ow * 0.38, -oh * 0.95, ow * 0.76, oh * 0.35);
            ctx.fillStyle = '#FF2A6D';
            ctx.fillRect(-ow * 0.45, -oh * 0.45, ow * 0.22, oh * 0.18);
            ctx.fillRect(ow * 0.23, -oh * 0.45, ow * 0.22, oh * 0.18);
          }
          ctx.restore();
        });

        // Weather & Blindspot Overlay
        if (this.activeFaults.has('weather_degradation')) {
          ctx.fillStyle = 'rgba(25, 40, 60, 0.45)';
          ctx.fillRect(0, 0, w, h);
        }
        if (this.activeFaults.has('sensor_blindspot')) {
          ctx.fillStyle = 'rgba(255, 0, 50, 0.3)';
          ctx.fillRect(w * 0.6, 0, w * 0.4, h);
          ctx.fillStyle = '#FF2A6D';
          ctx.font = 'bold 18px monospace';
          ctx.fillText('[SENSOR OCCLUDED - LIDAR/CAM R-SECTOR]', w * 0.62, 50);
        }

        // Hood
        ctx.fillStyle = '#060B12';
        ctx.beginPath();
        ctx.moveTo(cx - 320, h); ctx.lineTo(cx - 160, h - 35);
        ctx.lineTo(cx + 160, h - 35); ctx.lineTo(cx + 320, h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#00F0FF44'; ctx.lineWidth = 2; ctx.stroke();
      }
      tickTelemetry() {
        if (!this.telemetryCallback) return;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const horizon = h * 0.46;
        const cx = w * 0.5;

        const tracked = [];
        let minTtc = Infinity;
        let mostCrit = null;

        const dt = 0.05;
        this.objects.forEach(obj => {
          const relMps = ((this.egoSpeed - obj.speedKmh) * 1000) / 3600;
          obj.distanceZ -= relMps * dt;
          if (obj.distanceZ > 120.0) {
            obj.distanceZ = 20.0 + Math.random() * 20;
          } else if (obj.distanceZ < 5.0) {
            obj.distanceZ = 5.0;
          }

          const scale = Math.max(0.1, Math.min(1.3, 28 / (obj.distanceZ + 5)));
          const yScreen = horizon + (h - horizon) * Math.pow(Math.max(0.02, 1 - obj.distanceZ / 100), 1.8);
          const sp = (yScreen - horizon) / (h - horizon);
          const xScreen = cx + (obj.lane * 140 + obj.lateralOffset * 100) * sp * 2.2;
          const ow = (obj.class === 'truck' ? 110 : obj.class === 'pedestrian' ? 35 : 90) * scale;
          const oh = (obj.class === 'truck' ? 90 : obj.class === 'pedestrian' ? 75 : 65) * scale;

          let ttc = relMps > 0.5 && obj.distanceZ > 0 ? obj.distanceZ / relMps : Infinity;
          let risk = ttc < 2.5 || (obj.lane === 0 && obj.distanceZ < 18) || obj.class === 'pedestrian' ? 'CRITICAL' : ttc < 4.5 ? 'CAUTION' : 'SAFE';

          const tObj = {
            id: obj.id,
            class: obj.class,
            bbox: [Math.round(xScreen - ow/2), Math.round(yScreen - oh), Math.round(xScreen + ow/2), Math.round(yScreen)],
            confidence: 0.96,
            distance: Math.round(obj.distanceZ * 10) / 10,
            relativeVelocity: Math.round(relMps * 10) / 10,
            ttc: ttc === Infinity ? 99.9 : Math.round(ttc * 10) / 10,
            riskLevel: risk,
            trajectory: [
              { x: xScreen, y: yScreen },
              { x: xScreen + (obj.lane * 8), y: yScreen - 25 },
              { x: xScreen + (obj.lane * 16), y: yScreen - 50 }
            ],
            position3D: { x: obj.lane * 3.5 + obj.lateralOffset * 2.0, y: 0, z: obj.distanceZ }
          };
          tracked.push(tObj);
          if (ttc < minTtc && obj.lane === 0) {
            minTtc = ttc;
            mostCrit = tObj;
          }
        });

        // Compute Temporal Sensor Confidence Evolution
        const now = Date.now();
        const currentFaults = new Set(this.activeFaults.keys());
        currentFaults.forEach(f => {
          if (!this.lastFaultKeys.has(f)) {
            this.eventCounter++;
            this.eventMarkers.push({
              id: `evt-${this.eventCounter}`,
              timestamp: now,
              timeLabel: new Date().toTimeString().split(' ')[0],
              event: `${f.toUpperCase().replace(/_/g, ' ')} STARTED`,
              reason: `Fault condition '${f}' activated`,
              severity: f.includes('failure') || f.includes('override') ? 'WARNING' : 'CAUTION'
            });
            if (this.eventMarkers.length > 20) this.eventMarkers.shift();
          }
        });
        this.lastFaultKeys.forEach(f => {
          if (!currentFaults.has(f)) {
            this.eventCounter++;
            this.eventMarkers.push({
              id: `evt-${this.eventCounter}`,
              timestamp: now,
              timeLabel: new Date().toTimeString().split(' ')[0],
              event: `${f.toUpperCase().replace(/_/g, ' ')} RESOLVED`,
              reason: `Condition '${f}' cleared, sensors recovering`,
              severity: 'INFO'
            });
            if (this.eventMarkers.length > 20) this.eventMarkers.shift();
          }
        });
        this.lastFaultKeys = currentFaults;

        const hasWeather = this.activeFaults.has('weather_degradation');
        const hasBlindspot = this.activeFaults.has('sensor_blindspot');
        const hasLidarFail = this.activeFaults.has('lidar_failure');

        const rawTargets = {
          camera: { raw: hasWeather ? 0.38 : hasBlindspot ? 0.32 : 0.98, reason: hasWeather ? 'SEVERE_FOG' : hasBlindspot ? 'SECTOR_OCCLUSION' : 'NOMINAL_CLEAR', health: hasWeather || hasBlindspot ? 'DEGRADED' : 'ONLINE' },
          lidar: { raw: hasLidarFail ? 0.05 : hasWeather ? 0.65 : hasBlindspot ? 0.40 : 0.96, reason: hasLidarFail ? 'LASER_EMITTER_TIMEOUT' : hasWeather ? 'BACKSCATTER_NOISE' : hasBlindspot ? 'SECTOR_OCCLUSION' : 'NOMINAL_CLEAR', health: hasLidarFail ? 'FAULT' : hasWeather || hasBlindspot ? 'DEGRADED' : 'ONLINE' },
          radar: { raw: hasWeather ? 0.98 : 0.95, reason: hasWeather ? 'PENETRATES_FOG' : 'NOMINAL_CLEAR', health: 'ONLINE' },
          imu: { raw: 0.99, reason: 'NOMINAL_CLEAR', health: 'ONLINE' },
          gnss: { raw: hasWeather ? 0.90 : 0.94, reason: hasWeather ? 'ATMOSPHERIC_ATTENUATION' : 'NOMINAL_CLEAR', health: 'ONLINE' }
        };

        const emaAlpha = 0.20;
        const currentConf = {};
        ['camera', 'lidar', 'radar', 'imu', 'gnss'].forEach(s => {
          const prev = this.smoothedConfidence[s];
          const target = rawTargets[s].raw;
          const smoothed = Math.max(0, Math.min(1, emaAlpha * target + (1 - emaAlpha) * prev));
          this.smoothedConfidence[s] = smoothed;
          const delta = smoothed - prev;
          currentConf[s] = {
            confidence: Math.round(smoothed * 1000) / 1000,
            confidencePct: Math.round(smoothed * 1000) / 10,
            trend: delta > 0.005 ? 'RISING' : delta < -0.005 ? 'FALLING' : 'STABLE',
            reason: rawTargets[s].reason,
            health: rawTargets[s].health
          };
        });

        this.confidenceHistory.push({
          timestamp: now,
          camera: currentConf.camera.confidence,
          lidar: currentConf.lidar.confidence,
          radar: currentConf.radar.confidence,
          imu: currentConf.imu.confidence,
          gnss: currentConf.gnss.confidence
        });
        if (this.confidenceHistory.length > 350) this.confidenceHistory.shift();

        const isRadarPreferred = (currentConf.camera.confidence < 0.60 || currentConf.lidar.confidence < 0.60) && currentConf.radar.confidence > 0.85;
        const arbitration = {
          dominant_sensor: isRadarPreferred ? 'RADAR' : 'FUSED_NOMINAL',
          is_degraded_arbitration: isRadarPreferred,
          override_reason: isRadarPreferred ? `RADAR arbitrated over CAM/LiDAR (RADAR: ${currentConf.radar.confidencePct}%, CAM: ${currentConf.camera.confidencePct}% [${currentConf.camera.reason}])` : 'Nominal multi-sensor optical/RF consensus'
        };
        const arbitrationText = isRadarPreferred ? ` [Sensor Arbitration: ${arbitration.override_reason}]` : '';

        let action = 'Maintain';
        let urgency = 'low';
        const reasoning = {};
        const lead = tracked.find(o => Math.abs(o.position3D.x) < 1.8 && o.position3D.z < 25);
        if (this.activeFaults.has('manual_override') || this.activeFaults.has('emergency_stop')) {
          action = 'Emergency Braking: Manual Override'; urgency = 'critical';
          reasoning['Maintain'] = 'REJECTED: Operator takeover override engaged.';
          reasoning['Brake'] = 'ACCEPTED: Maximum deceleration requested.';
          this.egoSpeed = Math.max(0, this.egoSpeed - 55.0 * 0.05);
          this.brakePressure = 100;
          this.throttle = 0;
        } else if (this.activeFaults.has('sudden_brake') || this.activeFaults.has('sudden_braking')) {
          action = 'Emergency Braking: Operator Hard Brake Applied'; urgency = 'critical';
          reasoning['Maintain'] = 'REJECTED: Operator emergency handbrake commanded.';
          reasoning['Brake'] = 'ACCEPTED: Maximum handbrake deceleration (-8.5 m/s²) engaged. Ego vehicle bringing to stop.';
          this.egoSpeed = Math.max(0, this.egoSpeed - 55.0 * 0.05);
          this.brakePressure = 100;
          this.throttle = 0;
        } else if (this.activeFaults.has('pedestrian_jaywalking')) {
          action = 'Emergency Braking: Yielding to Pedestrian #777'; urgency = 'critical';
          reasoning['Maintain'] = 'REJECTED: Pedestrian crossing ego travel lane.';
          reasoning['Brake'] = 'ACCEPTED: Full stop applied. Yielding to pedestrian crossing.';
        } else if (this.activeFaults.has('sensor_blindspot')) {
          action = 'Emergency Braking: Sensor Blindspot Occlusion'; urgency = 'critical';
          reasoning['Maintain'] = 'REJECTED: Forward/right perception sector occluded.';
          reasoning['Brake'] = 'ACCEPTED: Safety braking deceleration engaged.';
        } else if (lead && (lead.ttc < 2.2 || lead.distance < 16)) {
          urgency = 'critical';
          action = lead.ttc < 1.5 ? 'Swerve' : 'Emergency Braking';
          reasoning['Maintain'] = `REJECTED: Collision risk with Target #${lead.id} in ${lead.ttc.toFixed(1)}s.${arbitrationText}`;
          reasoning['Brake'] = `OPTIMAL: Full ABS brake deceleration active.${arbitrationText}`;
          reasoning['Swerve'] = 'STANDBY: Adjacent lane verification in progress.';
        } else if (lead && lead.distance < 28) {
          action = 'Brake'; urgency = 'medium';
          reasoning['Maintain'] = `CAUTION: Approaching lead Target #${lead.id} (${lead.distance.toFixed(1)}m).${arbitrationText}`;
          reasoning['Brake'] = `OPTIMAL: Smooth regenerative braking applied.${arbitrationText}`;
        } else {
          action = 'Maintain'; urgency = 'low';
          reasoning['Maintain'] = `OPTIMAL: Forward travel corridor clear.${arbitrationText}`;
        }

        const isHazard = this.activeFaults.size > 0 || urgency === 'critical' || this.brakePressure > 0;
        if (isHazard && !this.inHazard) {
          this.hazardCount = (this.hazardCount || 0) + 1;
          this.inHazard = true;
        } else if (!isHazard) {
          this.inHazard = false;
        }

        const packet = {
          timestamp: Date.now(),
          frameId: this.frameCount,
          objects: tracked,
          decision: {
            id: `dec-${this.frameCount}`,
            timestamp: new Date().toTimeString().split(' ')[0] + `.${Math.floor(Date.now()%1000/100)}`,
            action,
            confidence: Math.round(currentConf.camera.confidence * 100) / 100,
            targetSpeedKmh: Math.round(this.targetSpeed),
            reasoning,
            primaryReason: reasoning[action] || 'Nominal autonomous driving.',
            urgency
          },
          metrics: {
            speedKmh: Math.round(this.egoSpeed * 10) / 10,
            speedMph: Math.round(this.egoSpeed * 0.621371 * 10) / 10,
            targetSpeedKmh: Math.round(this.targetSpeed),
            steeringAngleDeg: Math.round(this.steering * 10) / 10,
            accelerationG: action.includes('Brake') ? -0.45 : 0.08,
            lateralG: Math.round(this.steering * 0.02 * 100) / 100,
            brakePressurePct: this.brakePressure,
            throttlePct: this.throttle,
            gear: 'D',
            driveMode: this.activeFaults.has('manual_override') ? 'MANUAL_OVERRIDE' : 'AUTONOMOUS',
            batterySoc: 89,
            distanceToLeadVehicle: lead ? lead.distance : 99.9,
            sensorStatus: {
              camera: currentConf.camera.health === 'DEGRADED' ? 'DEGRADED' : 'HEALTHY',
              lidar: currentConf.lidar.health === 'FAULT' ? 'FAULT' : currentConf.lidar.health === 'DEGRADED' ? 'DEGRADED' : 'HEALTHY',
              radar: 'HEALTHY',
              imu: 'HEALTHY',
              gnss: currentConf.gnss.health === 'DEGRADED' ? 'DEGRADED' : 'HEALTHY'
            }
          },
          sensorConfidence: {
            current: currentConf,
            history: this.confidenceHistory,
            events: this.eventMarkers,
            arbitration
          },
          ttcAlert: {
            level: minTtc < 2.5 ? 'CRITICAL' : minTtc < 4.5 ? 'CAUTION' : 'SAFE',
            ttcSeconds: minTtc === Infinity ? 99.9 : Math.round(minTtc * 10) / 10,
            targetId: mostCrit ? mostCrit.id : null,
            targetClass: mostCrit ? mostCrit.class : null,

          },
          activeFaults: Array.from(this.activeFaults.keys())
        };
        this.telemetryCallback(packet);
      }

    // --- SensorConfidencePanel Component ---
    function SensorConfidencePanel({ confidenceData }) {
      const canvasRef = React.useRef(null);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const current = confidenceData?.current;
      const history = confidenceData?.history || [];
      const events = confidenceData?.events || [];
      const arbitration = confidenceData?.arbitration;

      const SENSORS = {
        camera: { label: 'CAM', color: '#00F0FF' },
        lidar: { label: 'LIDAR', color: '#A855F7' },
        radar: { label: 'RADAR', color: '#10B981' },
        imu: { label: 'IMU', color: '#F59E0B' },
        gnss: { label: 'GNSS', color: '#3B82F6' }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        ctx.fillStyle = '#050A14';
        ctx.fillRect(0, 0, width, height);

        const pad = { top: 15, right: 25, bottom: 20, left: 35 };
        const gW = width - pad.left - pad.right;
        const gH = height - pad.top - pad.bottom;

        // Grid
        ctx.strokeStyle = '#121E31';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#64748B';
        ctx.font = '9px monospace';
        ctx.textAlign = 'right';

        [0, 50, 100].forEach(p => {
          const y = pad.top + gH - (p / 100) * gH;
          ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
          ctx.fillText(`${p}%`, pad.left - 4, y + 3);
        });

        if (history.length < 2) return;
        const latestTs = history[history.length - 1].timestamp;
        const windowMs = 15000;
        const startTs = latestTs - windowMs;

        const getPt = (ts, val) => {
          const x = pad.left + Math.max(0, Math.min(1, (ts - startTs) / windowMs)) * gW;
          const y = pad.top + gH - Math.max(0, Math.min(1, val)) * gH;
          return { x, y };
        };

        // Event lines
        events.forEach(evt => {
          if (evt.timestamp >= startTs && evt.timestamp <= latestTs) {
            const { x } = getPt(evt.timestamp, 0.5);
            ctx.save();
            ctx.strokeStyle = evt.severity === 'WARNING' ? 'rgba(244, 63, 94, 0.6)' : 'rgba(250, 204, 21, 0.6)';
            ctx.setLineDash([2, 2]);
            ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, height - pad.bottom); ctx.stroke();
            ctx.restore();
          }
        });

        // Lines
        Object.keys(SENSORS).forEach(k => {
          ctx.strokeStyle = SENSORS[k].color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          let first = true;
          history.forEach(pt => {
            if (pt.timestamp < startTs) return;
            const { x, y } = getPt(pt.timestamp, pt[k] ?? 0.95);
            if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
          });
          ctx.stroke();
        });
      }, [history, events]);

      return (
        <section className="bg-[#080D17]/90 backdrop-blur-md rounded-xl border border-[#1A2638] p-4 flex flex-col gap-3 shadow-lg">
          <div className="flex justify-between items-center border-b border-[#1A2638] pb-2 text-xs font-mono">
            <span className="text-cyan-400 font-bold uppercase tracking-wider">SENSOR CONFIDENCE EVOLUTION &amp; ARBITRATION MATRIX</span>
            {arbitration?.is_degraded_arbitration ? (
              <span className="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 border border-purple-500/40 text-[11px] font-bold animate-pulse">
                🛡️ RADAR ARBITRATION OVERRIDE ACTIVE
              </span>
            ) : (
              <span className="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 text-[11px]">
                ✨ MULTI-SENSOR CONSENSUS (NOMINAL)
              </span>
            )}
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 font-mono text-xs">
            {Object.entries(SENSORS).map(([k, cfg]) => {
              const item = current ? current[k] : null;
              const pct = item?.confidencePct ?? (item?.confidence ? item.confidence * 100 : 95);
              const isLow = pct < 60;
              const isCrit = pct < 30;
              return (
                <div key={k} className={`p-2.5 rounded-lg border flex flex-col gap-1.5 ${isCrit ? 'bg-rose-950/20 border-rose-500/40' : isLow ? 'bg-amber-950/20 border-amber-500/40' : 'bg-[#050A14] border-[#141E2F]'}`}>
                  <div className="flex justify-between items-center text-[11px]">
                    <span className="font-bold text-slate-200">{k.toUpperCase()}</span>
                    <span className={`text-[10px] px-1 rounded font-bold ${item?.health === 'DEGRADED' ? 'bg-amber-500/20 text-amber-300' : item?.health === 'FAULT' ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                      {item?.health || 'ONLINE'}
                    </span>
                  </div>
                  <div className="flex items-baseline justify-between">
                    <span className={`text-xl font-bold ${isCrit ? 'text-rose-400' : isLow ? 'text-amber-400' : 'text-slate-100'}`}>
                      {pct.toFixed(1)}%
                    </span>
                    <span className="text-[10px] text-slate-400">{item?.trend || 'STABLE'}</span>
                  </div>
                  <div className="w-full h-1 bg-[#121E31] rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{ width: `${pct}%`, backgroundColor: isCrit ? '#F43F5E' : isLow ? '#F59E0B' : cfg.color }} />
                  </div>
                  <div className="text-[9px] text-slate-400 truncate">[{item?.reason || 'NOMINAL_CLEAR'}]</div>
                </div>
              );
            })}
          </div>

          <div className="bg-[#050A14] rounded-lg border border-[#141E2F] p-2.5 flex flex-col gap-1.5">
            <div className="flex justify-between items-center text-xs font-mono text-slate-300">
              <span className="font-bold">15-SECOND ROLLING TEMPORAL CONFIDENCE GRAPH</span>
              <div className="flex gap-2 text-[10px]">
                {Object.entries(SENSORS).map(([k, cfg]) => (
                  <span key={k} className="flex items-center gap-1">
                    <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cfg.color }} />
                    <span>{k.toUpperCase()}</span>
                  </span>
                ))}
              </div>
            </div>
            <div className="w-full h-28 relative rounded overflow-hidden">
              <canvas ref={canvasRef} className="w-full h-full block" />
            </div>
          </div>
        </section>
      );
    }

    // --- Main App React Component ---
    function App() {

      const overlayCanvasRef = useRef(null);
      const latestFrameRef = useRef(null);
      const latestTelemetryRef = useRef(null);
      const terminalEndRef = useRef(null);
      const bitmapRef = useRef(null);

      // WebSocket status
      const [videoWsStatus, setVideoWsStatus] = useState({ status: 'CONNECTING', fps: 0 });
      const [telWsStatus, setTelWsStatus] = useState({ status: 'CONNECTING', fps: 0, latency: 0 });
      const telWsRef = useRef(null);
      const videoWsRef = useRef(null);

      // Connect WebSockets
      useEffect(() => {
        const connectSockets = () => {
          try {
            const vws = new WebSocket('ws://localhost:8000/ws/video');
            vws.binaryType = 'arraybuffer';
            vws.onopen = () => setVideoWsStatus({ status: 'CONNECTED', fps: 30 });
            vws.onmessage = (e) => {
              if (!isMockMode) latestFrameRef.current = e.data;
            };
            vws.onclose = () => setVideoWsStatus({ status: 'DISCONNECTED', fps: 0 });
            vws.onerror = () => setVideoWsStatus({ status: 'ERROR', fps: 0 });
            videoWsRef.current = vws;

            const tws = new WebSocket('ws://localhost:8000/ws/telemetry');
            tws.onopen = () => setTelWsStatus({ status: 'CONNECTED', fps: 20, latency: 2 });
            tws.onmessage = (e) => {
              try {
                const data = JSON.parse(e.data);
                if (data.decision && !isMockMode) {
                  latestTelemetryRef.current = data;
                  setTelemetry(data);
                  if (data.activeFaults) setActiveFaults(data.activeFaults);
                }
              } catch(err){}
            };
            tws.onclose = () => setTelWsStatus({ status: 'DISCONNECTED', fps: 0, latency: 0 });
            tws.onerror = () => setTelWsStatus({ status: 'ERROR', fps: 0, latency: 0 });
            telWsRef.current = tws;
          } catch(e){}
        };
        connectSockets();

        mockEngine.setCallbacks(
          (blob) => { if (isMockMode) latestFrameRef.current = blob; },
          (packet) => {
            if (isMockMode) {
              latestTelemetryRef.current = packet;
              setTelemetry(packet);
              if (packet.activeFaults) setActiveFaults(packet.activeFaults);
            }
          }
        );
        if (isMockMode) {
          mockEngine.start();
        } else {
          mockEngine.stop();
        }

        return () => {
          mockEngine.stop();
          if (videoWsRef.current) videoWsRef.current.close();
          if (telWsRef.current) telWsRef.current.close();
        };
      }, [isMockMode]);

      // Logging
      useEffect(() => {
        if (!telemetry?.decision) return;
        const dec = telemetry.decision;
        const entry = {
          id: `${dec.id}-${Date.now()}`,
          timestamp: dec.timestamp,
          action: dec.action,
          confidence: dec.confidence,
          targetSpeed: dec.targetSpeedKmh,
          primaryReason: dec.primaryReason,
          urgency: dec.urgency
        };
        setLogs(prev => [...prev.slice(-150), entry]);
      }, [telemetry?.decision?.id]);

      useEffect(() => {
        if (autoScroll && terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs, autoScroll]);

      // Canvas Rendering Loop
      useEffect(() => {
        let active = true;
        let isDecoding = false;

        const renderLoop = () => {
          if (!active) return;
          const vCanvas = videoCanvasRef.current;
          const oCanvas = overlayCanvasRef.current;
          const tel = latestTelemetryRef.current;

          if (latestFrameRef.current && !isDecoding) {
            isDecoding = true;
            const blob = latestFrameRef.current instanceof Blob ? latestFrameRef.current : new Blob([latestFrameRef.current], { type: 'image/jpeg' });
            createImageBitmap(blob).then(bmp => {
              if (bitmapRef.current) bitmapRef.current.close();
              bitmapRef.current = bmp;
              isDecoding = false;
            }).catch(() => { isDecoding = false; });
          }

          if (vCanvas && bitmapRef.current) {
            const ctx = vCanvas.getContext('2d');
            ctx.drawImage(bitmapRef.current, 0, 0, vCanvas.width, vCanvas.height);
          }

          if (oCanvas && tel) {
            const ctx = oCanvas.getContext('2d');
            ctx.clearRect(0, 0, oCanvas.width, oCanvas.height);
            drawOverlays(ctx, oCanvas.width, oCanvas.height, tel);
          }

          requestAnimationFrame(renderLoop);
        };
        requestAnimationFrame(renderLoop);
        return () => { active = false; };

      const drawOverlays = (ctx, w, h, tel) => {
        const horizon = h * 0.46;
        const cx = w * 0.5;
        const now = Date.now();

        // Trajectory Corridor
        const isEmergency = tel.decision.action.includes('Brake') || tel.decision.urgency === 'critical';
        ctx.fillStyle = isEmergency ? 'rgba(255, 42, 109, 0.25)' : 'rgba(0, 240, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(cx - 130, h);
        ctx.lineTo(cx - 20, horizon + 20);
        ctx.lineTo(cx + 20, horizon + 20);
        ctx.lineTo(cx + 130, h);
        ctx.closePath();
        ctx.fill();

        // Draw Bounding Boxes & Animated Tracking
        tel.objects.forEach(obj => {
          const [xmin, ymin, xmax, ymax] = obj.bbox;
          const bw = Math.max(20, xmax - xmin);
          const bh = Math.max(30, ymax - ymin);
          const isPed = obj.class === 'pedestrian';
          const isCrit = obj.riskLevel === 'CRITICAL' || isPed;
          const isCaut = obj.riskLevel === 'CAUTION';
          const col = isCrit ? '#FF2A6D' : isCaut ? '#FFB800' : '#00F0FF';

          // Trajectory Spline & Crossing Vector
          if (obj.trajectory && obj.trajectory.length > 0) {
            ctx.strokeStyle = col;
            ctx.lineWidth = isPed ? 3 : 2;
            ctx.setLineDash(isPed ? [6, 4] : [4, 4]);
            ctx.beginPath();
            ctx.moveTo(obj.trajectory[0].x, obj.trajectory[0].y);
            obj.trajectory.forEach(pt => ctx.lineTo(pt.x, pt.y));
            ctx.stroke();
            ctx.setLineDash([]);

            // Trajectory Destination Beacon
            const endPt = obj.trajectory[obj.trajectory.length - 1];
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(endPt.x, endPt.y, isPed ? 5 : 3, 0, Math.PI * 2);
            ctx.fill();
          }

          // Cyber Corner Brackets & Animated Box Fill
          ctx.strokeStyle = col;
          ctx.lineWidth = isCrit ? 2.5 : 1.5;
          const pulseAlpha = isCrit ? (0.15 + Math.sin(now * 0.008) * 0.08) : 0.06;
          ctx.fillStyle = isCrit ? `rgba(255,42,109,${pulseAlpha})` : 'rgba(0,240,255,0.06)';
          ctx.fillRect(xmin, ymin, bw, bh);

          // Brackets
          const cLen = Math.min(16, bw * 0.35);
          ctx.beginPath();
          ctx.moveTo(xmin, ymin + cLen); ctx.lineTo(xmin, ymin); ctx.lineTo(xmin + cLen, ymin);
          ctx.moveTo(xmax - cLen, ymin); ctx.lineTo(xmax, ymin); ctx.lineTo(xmax, ymin + cLen);
          ctx.moveTo(xmin, ymax - cLen); ctx.lineTo(xmin, ymax); ctx.lineTo(xmin + cLen, ymax);
          ctx.moveTo(xmax - cLen, ymax); ctx.lineTo(xmax, ymax); ctx.lineTo(xmax, ymax - cLen);
          ctx.stroke();

          // Animated Crosshair & Target Lock on Pedestrian
          if (isPed || isCrit) {
            const midX = xmin + bw / 2;
            const midY = ymin + bh / 2;
            const lockRot = (now * 0.003) % (Math.PI * 2);

            ctx.save();
            ctx.translate(midX, midY);
            ctx.rotate(lockRot);
            ctx.strokeStyle = '#FF2A6D';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(bw, bh) * 0.5 + 4, 0, Math.PI * 2);
            ctx.moveTo(-Math.min(bw, bh) * 0.7, 0); ctx.lineTo(Math.min(bw, bh) * 0.7, 0);
            ctx.moveTo(0, -Math.min(bw, bh) * 0.7); ctx.lineTo(0, Math.min(bw, bh) * 0.7);
            ctx.stroke();
            ctx.restore();
          }

          // Label Pill

          ctx.font = 'bold 11px JetBrains Mono, monospace';
          const tw = ctx.measureText(tag).width + 14;
          ctx.fillStyle = 'rgba(6, 11, 20, 0.92)';
          ctx.fillRect(xmin, Math.max(8, ymin - 24), tw, 22);
          ctx.strokeStyle = col;
          ctx.strokeRect(xmin, Math.max(8, ymin - 24), tw, 22);
          
          // Accent tag indicator bar
          ctx.fillStyle = col;
          ctx.fillRect(xmin, Math.max(8, ymin - 24), 3, 22);

          ctx.fillStyle = isCrit ? '#FF2A6D' : '#E2E8F0';
          ctx.fillText(tag, xmin + 8, Math.max(8, ymin - 24) + 15);
        });
      };

                      <div><span className="text-slate-400 text-[11px]">Avg Deviation:</span> <div className="text-sm font-bold text-slate-200">{pathDev.avgMeters?.toFixed(3) || '0.000'} m</div></div>
                      <div><span className="text-slate-400 text-[11px]">Peak Deviation:</span> <div className="text-sm font-bold text-cyan-400">{pathDev.maxMeters?.toFixed(3) || '0.000'} m</div></div>
                      <div><span className="text-slate-400 text-[11px]">Pedestrians Detected:</span> <div className="text-sm font-bold text-slate-200">{totalPeds} Total</div></div>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-[#050A14] border border-[#162338] space-y-2 text-xs">
                    <div className="flex justify-between items-center border-b border-[#142033] pb-2 font-bold text-slate-200">
                      <span>AUTONOMOUS SENSOR GATING REPORT</span>
                      <span className="text-purple-400">{telemetry?.metrics?.journeySummary?.sensorGatingEfficiency || '99.8% Optimal'}</span>
                    </div>
                    <p className="text-slate-300 text-xs leading-relaxed pt-1">
                      <span className="text-slate-500">Autonomous Gating Rationale: </span>
                      {telemetry?.metrics?.sensorOrchestration?.rationale || 'Autonomous perception model dynamically gated and focused sensors according to real-time road hazard contexts.'}
                    </p>
                  </div>
                </div>

                <div className="bg-[#050A14] p-4 border-t border-[#162338] flex justify-between items-center gap-3">
                  <button
                    onClick={() => setShowSummaryModal(false)}
                    className="px-4 py-2 rounded-xl bg-[#0A1220] border border-[#1A2638] text-slate-300 hover:text-white text-xs font-bold"
                  >
                    Close View
                  </button>
                  <button
                    onClick={() => {
                      sendFault({ action: 'reset_journey' });
                      setShowSummaryModal(false);
                    }}
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white text-xs font-bold shadow-lg"
                  >
                    START NEW JOURNEY / RESET TRIP
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
